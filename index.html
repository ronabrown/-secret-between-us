<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Between Us</title>
<style>
:root{--bg:#0d1020;--card:#191e35;--muted:#b8bfd5;--accent:#9b83ff;--line:#343b5a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#25234b,var(--bg) 55%);color:#fff;font-family:system-ui,Arial}
.card{width:min(100%,440px);background:var(--card);padding:28px;border:1px solid #ffffff16;border-radius:22px;box-shadow:0 18px 60px #0007;text-align:center}
h1{color:#c0afff;margin:0 0 12px}p{color:var(--muted);line-height:1.8}
input,textarea{width:100%;padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:11px;background:#10152a;color:#fff;font:inherit}
button{width:100%;padding:14px;margin-top:12px;background:#7958e8;color:#fff;border:0;border-radius:11px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}.note{font-size:13px;color:#d8d2f3;background:#242344;padding:10px;border-radius:10px}
.info{width:auto;background:transparent;border:1px solid var(--line);padding:7px 12px;margin-top:18px;border-radius:50%;font-size:14px}
.hidden{display:none}.progress{height:6px;background:var(--line);border-radius:8px;margin:20px 0}.bar{height:6px;width:0;background:var(--accent);border-radius:8px}
.status{font-size:13px;min-height:20px;color:#ffcf9d}a{color:#c0afff}
</style>
</head>
<body>
<main class="card">
<section id="welcome">
<h1>✦ Secret Between Us</h1>
<p>جاوب على أسئلة خفيفة عن الصداقة وشارك رأيك بصراحة.</p>
<input id="name" maxlength="60" autocomplete="name" placeholder="اكتب اسمك أو لقبك">
<p class="note">هيا سجل الان</p>
<button id="startBtn" onclick="start()">ابدأ المشاركة ✨</button>
<div id="status" class="status" role="status"></div>
<button class="info" onclick="showInfo()" aria-label="معلومات الخصوصية">ⓘ</button>
</section>
<section id="quiz" class="hidden">
<h2 id="number"></h2><div class="progress"><div id="bar" class="bar"></div></div>
<h3 id="question"></h3>
<textarea id="answer" rows="4" maxlength="1500" placeholder="اكتب إجابتك هنا..."></textarea>
<button onclick="next()">التالي ←</button>
<div id="quizStatus" class="status" role="status"></div>
</section>
<section id="finish" class="hidden"><h1>شكرًا لمشاركتك ❤️</h1><p>تم إرسال إجاباتك بنجاح.</p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Add your Supabase Project URL and anon/public key below. Never put a service_role key here. */
const SUPABASE_URL = "https://ezrtwfzsuprycehtlosm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_easJQ0N9PA7-0fvvpsYRgA_4XwwESUP";
const supabaseReady = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_");
const db = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const questions = [
"مين أقرب شخص ليك؟",
"إيه أول انطباع أخدته عن صاحب اللينك؟",
"إيه صفة بتقدّرها جدًا في أصحابك؟",
"إيه ذكرى جميلة مش بتنساها؟",
"إيه نصيحة كنت محتاج تسمعها؟",
"إيه أكتر حاجة بتخليك تثق في شخص؟",
"لو تقدر تشكر شخص، هتشكر مين وليه؟",
"إيه حاجة نفسك تحققها السنة دي؟",
"إيه أكتر موقف علّمك حاجة مهمة؟",
"رسالة تحب توصلها لصاحب الاستبيان؟"
];
let index=0, answers=[], locationData=null;

function showInfo(){
 alert("الخصوصية: إذا اخترت السماح بالموقع عند بدء المشاركة، تُرسل إحداثيات الموقع ودقته إلى صاحب الاستبيان وتُعرض في لوحة التحكم. الموقع اختياري؛ يمكنك اختيار عدم السماح والمتابعة. تُرسل إجاباتك واسمك إلى قاعدة بيانات الاستبيان.");
}
function setStatus(msg){document.getElementById("status").textContent=msg;}
function start(){
 const name=document.getElementById("name").value.trim();
 if(!name){setStatus("اكتب اسمًا أو لقبًا للمتابعة.");return;}
 if(!db){setStatus("الموقع لم يُربط بقاعدة البيانات بعد. أكمل إعداد Supabase أولًا.");return;}
 const btn=document.getElementById("startBtn"); btn.disabled=true;
 setStatus("يمكنك السماح بمشاركة موقعك أو رفض الطلب والمتابعة بدون موقع.");
 if(!navigator.geolocation){beginQuiz();return;}
 navigator.geolocation.getCurrentPosition(
  pos=>{locationData={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};beginQuiz();},
  ()=>{locationData=null;beginQuiz();},
  {enableHighAccuracy:true,timeout:15000,maximumAge:0}
 );
}
function beginQuiz(){
 document.getElementById("welcome").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 showQuestion();
}
function showQuestion(){
 document.getElementById("number").textContent=`السؤال ${index+1} من ${questions.length}`;
 document.getElementById("question").textContent=questions[index];
 document.getElementById("bar").style.width=((index/questions.length)*100)+"%";
 document.getElementById("answer").value="";
}
async function next(){
 const value=document.getElementById("answer").value.trim();
 const status=document.getElementById("quizStatus");
 if(!value){status.textContent="اكتب إجابتك الأول.";return;}
 answers.push({question:questions[index],answer:value}); index++;
 if(index<questions.length){status.textContent="";showQuestion();return;}
 const btn=document.querySelector("#quiz button");btn.disabled=true;status.textContent="جارٍ إرسال مشاركتك...";
 const payload={name:document.getElementById("name").value.trim(),answers,latitude:locationData?.latitude??null,longitude:locationData?.longitude??null,accuracy:locationData?.accuracy??null};
 const {error}=await db.from("submissions").insert(payload);
 if(error){status.textContent="تعذر الإرسال. تحقق من الاتصال ثم حاول مجددًا.";btn.disabled=false;index=questions.length-1;answers.pop();return;}
 document.getElementById("quiz").classList.add("hidden");document.getElementById("finish").classList.remove("hidden");
}
</script>
</body></html>
