<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Between Us</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d1020;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 90%;
  max-width: 420px;
  background: #191e35;
  padding: 28px;
  border-radius: 22px;
  box-shadow: 0 10px 40px #0008;
  text-align: center;
}

h1 {
  color: #a78bfa;
  font-size: 28px;
}

p {
  color: #b8bfd5;
  line-height: 1.8;
}

input, textarea {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #343b5a;
  border-radius: 10px;
  background: #10152a;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  background: #7958e8;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.progress {
  height: 6px;
  background: #343b5a;
  border-radius: 10px;
  margin: 20px 0;
}

#bar {
  height: 6px;
  background: #a78bfa;
  width: 0%;
  border-radius: 10px;
}

.hidden {
  display: none;
}

small {
  color: #aab2ca;
}
</style>
</head>

<body>

<div class="card">

<div id="welcome">
  <h1>✦ Secret Between Us</h1>
  <p>
    في شوية أسئلة حابب أعرف إجاباتك عليها...
    جاوب بصراحة وخليك على طبيعتك ❤️
  </p>

  <input id="name" placeholder="اكتب اسمك أو لقبك">

  <button onclick="start()">Let's Start ✨</button>
</div>

<div id="quiz" class="hidden">

  <h2 id="number"></h2>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <h3 id="question"></h3>

  <textarea id="answer"
    placeholder="اكتب إجابتك هنا..."
    rows="4"></textarea>

  <button onclick="next()">التالي ←</button>

</div>

<div id="finish" class="hidden">
  <h1>Thank You ❤️</h1>
  <p>شكراً إنك شاركت إجاباتك!</p>
</div>

</div>

<script>

const questions = [
"مين أقرب شخص ليك؟",
"إيه أول انطباع أخدته عن صاحب اللينك؟",
"هل في شخص نفسك تكلمه؟",
"إيه أكتر حاجة بتخاف تخسرها؟",
"مين أكتر شخص بتثق فيه؟",
"إيه أكتر موقف مش قادر تنساه؟",
"هل ندمت على معرفة شخص معين؟",
"إيه الحاجة اللي نفسك تقولها لحد ومش قادر؟",
"مين الشخص اللي وجوده بيفرق معاك؟",
"لو تقدر ترجع بالزمن هتغير إيه؟"
];

let index = 0;
let answers = [];

function start() {
  let name = document.getElementById("name").value.trim();

  if (!name) {
    alert("اكتب اسمك الأول!");
    return;
  }

  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  showQuestion();
}

function showQuestion() {
  document.getElementById("number").textContent =
    `Question ${index + 1} / ${questions.length}`;

  document.getElementById("question").textContent =
    questions[index];

  document.getElementById("bar").style.width =
    ((index / questions.length) * 100) + "%";

  document.getElementById("answer").value = "";
}

function next() {
  let answer = document.getElementById("answer").value.trim();

  if (!answer) {
    alert("اكتب إجابتك الأول!");
    return;
  }

  answers.push({
    question: questions[index],
    answer: answer
  });

  index++;

  if (index < questions.length) {
    showQuestion();
  } else {
    finish();
  }
}

function finish() {
  const submission = {
    name: document.getElementById("name").value.trim(),
    answers: answers,
    date: new Date().toISOString()
  };

  // حفظ محلي على نفس الجهاز للتجربة
  const saved = JSON.parse(
    localStorage.getItem("friendship_answers") || "[]"
  );

  saved.push(submission);

  localStorage.setItem(
    "friendship_answers",
    JSON.stringify(saved)
  );

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("finish").classList.remove("hidden");
}

</script>

</body>
</html>
