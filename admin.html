<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Between Us — عرض الأسماء والمواقع</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#0d1020;color:#fff;font-family:system-ui,Arial}.wrap{max-width:900px;margin:auto}.card{background:#191e35;border:1px solid #ffffff18;border-radius:16px;padding:18px;margin:14px 0}h1,h2{color:#c0afff}input{width:100%;padding:13px;margin:8px 0;border-radius:9px;border:1px solid #343b5a;background:#10152a;color:white}button{padding:11px 16px;border:0;border-radius:9px;background:#7958e8;color:white;margin:5px;cursor:pointer}.muted{color:#b8bfd5}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;border-top:1px solid #343b5a;padding:14px 0}.row:first-child{border-top:0}.name{font-weight:700}.loc a{color:#c0afff}.hidden{display:none!important}.status{white-space:pre-wrap}.sectionTitle{margin:10px 0 4px;padding-bottom:8px;border-bottom:1px solid #343b5a}
</style></head>
<body><div class="wrap">
<h1>Secret Between Us — الأسماء والمواقع</h1>
<div class="card" id="login">
<p class="muted">سجّل الدخول بحساب المدير في Supabase.</p>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">تسجيل الدخول</button><p id="loginStatus" class="muted status"></p>
</div>
<div id="panel" class="hidden">
<div class="card"><button id="refreshBtn">تحديث البيانات</button><button id="logoutBtn">تسجيل الخروج</button><p id="count" class="muted"></p><p id="status" class="muted status"></p></div>
<div class="card"><h2 class="sectionTitle">زوار الموقع — الاسم والموقع المشارك</h2><div id="visitorEntries"></div></div>
<div class="card"><h2 class="sectionTitle">سجلات لعبة Secret Between Us</h2><div id="gameEntries"></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ezrtwfzsuprycehtlosm.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_easJQ0N9PA7-0fvvpsYRgA_4XwwESUP";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
$('loginBtn').onclick=signIn;$('refreshBtn').onclick=loadData;$('logoutBtn').onclick=signOut;
async function signIn(){ $('loginStatus').textContent='جاري تسجيل الدخول…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginStatus').textContent='تعذر تسجيل الدخول: '+error.message;return;}$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadData(); }
async function signOut(){await db.auth.signOut();$('panel').classList.add('hidden');$('login').classList.remove('hidden');}
function addRows(target,rows){const box=$(target);box.innerHTML='';for(const p of rows){const row=document.createElement('div');row.className='row';const name=document.createElement('div');name.className='name';name.textContent=p.nickname||'بدون اسم';const loc=document.createElement('div');loc.className='loc';if(p.latitude!=null&&p.longitude!=null){const a=document.createElement('a');a.href='https://www.google.com/maps?q='+encodeURIComponent(p.latitude+','+p.longitude);a.target='_blank';a.rel='noopener';a.textContent='عرض الموقع على الخريطة';loc.append(a);}else loc.textContent='لا يوجد موقع محفوظ';row.append(name,loc);box.append(row);}if(!rows.length)box.textContent='لا توجد سجلات.';}
async function loadData(){
 $('status').textContent='جاري تحميل البيانات…';
 const [visitors,games]=await Promise.all([
  db.from('sbu_visitors').select('nickname,latitude,longitude,updated_at').order('updated_at',{ascending:false}),
  db.from('game_players').select('nickname,latitude,longitude').order('nickname',{ascending:true})
 ]);
 if(visitors.error){$('status').textContent='تعذر تحميل زوار الموقع: '+visitors.error.message+'\nتأكد من تشغيل ملف SQL الجديد وتسجيل الدخول بحساب المدير.';return;}
 if(games.error){$('status').textContent='تم تحميل زوار الموقع، لكن تعذر تحميل سجلات اللعبة القديمة: '+games.error.message;}
 else $('status').textContent='';
 const v=visitors.data||[],g=games.data||[];addRows('visitorEntries',v);addRows('gameEntries',g);$('count').textContent='زوار الموقع: '+v.length+' — سجلات اللعبة القديمة: '+g.length;
}
(async()=>{const {data:{session}}=await db.auth.getSession();if(session){$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadData();}})();
</script></body></html>
