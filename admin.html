<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Between Us — عرض الأسماء والمواقع</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#0d1020;color:#fff;font-family:system-ui,Arial}.wrap{max-width:850px;margin:auto}.card{background:#191e35;border:1px solid #ffffff18;border-radius:16px;padding:18px;margin:14px 0}h1{color:#c0afff}input{width:100%;padding:13px;margin:8px 0;border-radius:9px;border:1px solid #343b5a;background:#10152a;color:white}button{padding:11px 16px;border:0;border-radius:9px;background:#7958e8;color:white;margin:5px;cursor:pointer}.muted{color:#b8bfd5}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;border-top:1px solid #343b5a;padding:14px 0}.row:first-child{border-top:0}.name{font-weight:700}.loc a{color:#c0afff}.deleteBtn{background:#a83252;margin:0}.deleteBtn:hover{background:#c13b60}.hidden{display:none!important}.status{white-space:pre-wrap}
</style></head>
<body><div class="wrap">
<h1>Secret Between Us — الأسماء والمواقع</h1>
<div class="card" id="login">
<p class="muted">سجّل الدخول بحساب المدير في Supabase.</p>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">تسجيل الدخول</button><p id="loginStatus" class="muted status"></p>
</div>
<div id="panel" class="hidden">
<div class="card"><button id="refreshBtn">تحديث البيانات</button><button id="logoutBtn">تسجيل الخروج</button><p id="count" class="muted"></p><p id="status" class="muted status"></p></div>
<div class="card" id="entries"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ezrtwfzsuprycehtlosm.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_easJQ0N9PA7-0fvvpsYRgA_4XwwESUP";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
$('loginBtn').onclick=signIn;$('refreshBtn').onclick=loadData;$('logoutBtn').onclick=signOut;
async function signIn(){ $('loginStatus').textContent='جاري تسجيل الدخول…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginStatus').textContent='تعذر تسجيل الدخول: '+error.message;return;}$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadData(); }
async function signOut(){await db.auth.signOut();$('panel').classList.add('hidden');$('login').classList.remove('hidden');}
const HIDDEN_RESULTS_KEY='sbu_hidden_location_results_v1';
function getHiddenResults(){try{return new Set(JSON.parse(localStorage.getItem(HIDDEN_RESULTS_KEY)||'[]'));}catch{return new Set();}}
function resultKey(p){return [p.nickname||'',p.latitude??'',p.longitude??''].join('|');}
async function hideResult(p){if(!confirm('إخفاء هذه النتيجة من القائمة؟ لن يتم حذف أي بيانات من قاعدة البيانات.'))return;const hidden=getHiddenResults();hidden.add(resultKey(p));localStorage.setItem(HIDDEN_RESULTS_KEY,JSON.stringify([...hidden]));await loadData();}
async function loadData(){
 $('status').textContent='جاري تحميل البيانات…';
 // لا يتم تعديل أو حذف أي سجل؛ القراءة فقط من جدول اللاعبين.
 const {data,error}=await db.from('game_players').select('nickname,latitude,longitude').order('nickname',{ascending:true});
 if(error){$('status').textContent='تعذر تحميل البيانات: '+error.message+'\nتأكد أن حساب المدير لديه صلاحية قراءة جدول game_players وأن أعمدة الموقع اسمها latitude و longitude.';return;}
 const hidden=getHiddenResults();const visible=data.filter(p=>!hidden.has(resultKey(p)));
 $('status').textContent='';$('count').textContent='النتائج الظاهرة: '+visible.length+' من '+data.length;$('entries').innerHTML='';
 for(const p of visible){const row=document.createElement('div');row.className='row';const name=document.createElement('div');name.className='name';name.textContent=p.nickname||'بدون اسم';const loc=document.createElement('div');loc.className='loc';if(p.latitude!=null&&p.longitude!=null){const a=document.createElement('a');a.href='https://www.google.com/maps?q='+encodeURIComponent(p.latitude+','+p.longitude);a.target='_blank';a.rel='noopener';a.textContent='عرض الموقع على الخريطة';loc.append(a);}else{loc.textContent='لا يوجد موقع محفوظ';}const del=document.createElement('button');del.className='deleteBtn';del.textContent='حذف من القائمة';del.setAttribute('aria-label','حذف '+(p.nickname||'النتيجة')+' من القائمة');del.onclick=()=>hideResult(p);row.append(name,loc,del);$('entries').append(row);}
 if(!visible.length)$('entries').textContent='لا توجد نتائج ظاهرة.';
}
(async()=>{const {data:{session}}=await db.auth.getSession();if(session){$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadData();}})();
</script></body></html>
